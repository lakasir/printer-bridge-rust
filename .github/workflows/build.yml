name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            binary: target/release/printer-bridge
          - os: windows-latest
            platform: windows
            binary: target/release/printer-bridge.exe
          - os: macos-latest
            platform: macos
            binary: target/release/printer-bridge
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: printer-bridge-${{ matrix.platform }}
          path: ${{ matrix.binary }}
